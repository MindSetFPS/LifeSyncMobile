name: CI - LifeSync Mobile

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop, "release/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test]"
      - name: Pruebas unitarias y de integración
        run: python -m pytest
      - name: Auditoría de dependencias (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  mobile:
    name: Móvil (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Pruebas unitarias JVM
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Ensamblar APK de debug
        run: ./gradlew assembleDebug --no-daemon
      - name: Generar lock de dependencias runtime
        run: |
          cat > "$RUNNER_TEMP/lock.init.gradle.kts" <<'EOF'
          allprojects {
              configurations.configureEach {
                  if (name.endsWith("RuntimeClasspath")) {
                      resolutionStrategy.activateDependencyLocking()
                  }
              }
          }
          EOF
          rm -f app/gradle.lockfile
          ./gradlew --init-script "$RUNNER_TEMP/lock.init.gradle.kts" \
            :app:dependencies --write-locks --no-daemon
      - name: Auditoría de dependencias (OSV)
        continue-on-error: true
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source app/gradle.lockfile --format table
      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: mobile/app/build/test-results
          retention-days: 7

  secretos:
    name: SAST (secretos hardcodeados)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escaneo de secretos (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" git . --redact --no-banner
