name: CI - LifeSync Mobile

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test]"
      - name: Pruebas unitarias y de integración
        run: python -m pytest

  mobile:
    name: Móvil (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Generar Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      - name: Pruebas unitarias JVM
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Ensamblar APK de debug
        run: ./gradlew assembleDebug --no-daemon
      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: mobile/app/build/test-results
